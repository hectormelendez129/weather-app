<!DOCTYPE html>
<html lang="en">
	<head>

    	<meta name="description" content="This is where your description goes">

		<title>Current Weather App</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>

		<h1>Enter City Name</h1>
		<input type="text" name="" value="" placeholder="Enter City">

		<h4>Enter Country</h4>
		<input type="text" id="country" placeholder="Enter Country">
		
		<input type="radio" name="unit" id="fahrenheit" value="imperial" checked>
		<label for="fahrenheit">Fahrenheit</label>

		<input type="radio" name="unit" id="celsius" value="metric">
		<label for="Celsius">Celsuis</label>
		
		<button type="button" name="button">Submit</button>

		<h2 id="city">Location: </h2>
		<div id="displayTemp"></div>
		<h3 id="currentTemp">Current Temperature: </h3>
		<h3 id="weather">Current weather: </h3>

	</body>
